packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3: true
  node-pty: true
  '@anthropic-ai/claude-agent-sdk': true
  '@openai/codex': true
  '@openai/codex-sdk': true

minimumReleaseAgeExclude:
  - '@openai/codex-sdk@0.153.4'
  - '@openai/codex@0.153.4-darwin-arm64 || 0.153.4-darwin-x64 || 0.153.4-linux-arm64 || 0.153.4-linux-x64 || 0.153.4-win32-arm64 || 0.153.4-win32-x64 || 0.153.4'
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0

verifyDepsBeforeRun: false
