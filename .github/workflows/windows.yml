name: Windows checks and release
run-name: ${{ github.event.inputs.validation == 'package' && 'Windows packaging diagnostic (unit gate skipped)' || 'Windows checks and release' }}
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Full gate or packaging diagnostic only (not release acceptance)
        type: choice
        default: full
        options: [full, package]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned workspace dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check types and deterministic tests
        if: github.event.inputs.validation != 'package'
        shell: pwsh
        run: |
          corepack pnpm typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          corepack pnpm exec vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile.json=e2e-out/unit-results.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows artifacts
        shell: pwsh
        run: |
          corepack pnpm build:win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native Electron fixtures (isolated homes, no model credentials)
        if: github.event.inputs.validation != 'package'
        shell: pwsh
        run: |
          corepack pnpm exec playwright test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Packaged runtime smoke
        shell: pwsh
        run: |
          corepack pnpm exec playwright test --config scripts/packaging/playwright.config.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capygen-test-failures
          if-no-files-found: ignore
          retention-days: 7
          path: |
            e2e-out/unit-results.json
            e2e-out/artifacts/**/error-context.md
            e2e-out/ux-repair-custom-failure.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capygen-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/artifacts/capygen-*-setup.exe
            release/artifacts/capygen-*-portable.exe
            release/artifacts/latest.yml
            release/artifacts/artifact-audit.json
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package version.' }
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified workflow artifacts and publish private release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $private = gh api "repos/$env:GH_REPO" --jq .private
          if ($LASTEXITCODE -or $private -ne 'true') { throw 'Release requires a private repository.' }
          gh run download $env:RUN_ID --name capygen-windows --dir artifacts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @files --verify-tag --title "capygen $env:RELEASE_TAG" --notes 'Windows x64 installer and portable. Unsigned builds; publisher identity is not verified. See artifact-audit.json for checksums.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
